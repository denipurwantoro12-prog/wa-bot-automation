<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Web Admin & Broadcast Studio</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0b141a; color: #e9edef; height: 100vh; display: flex; flex-direction: column; }
        
        .nav-tabs { display: flex; background-color: #111b21; border-bottom: 1px solid #222d34; padding: 0 20px; }
        .tab-btn { background: none; border: none; color: #8696a0; padding: 15px 25px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .tab-btn.active { color: #00a884; border-bottom: 3px solid #00a884; }

        .tab-content { display: none; flex: 1; height: calc(100vh - 53px); }
        .tab-content.active { display: flex; }

        /* LIVE CHAT PANEL */
        .chat-sidebar { width: 320px; background-color: #111b21; border-right: 1px solid #222d34; overflow-y: auto; }
        .contact-item { padding: 15px; border-bottom: 1px solid #222d34; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .contact-item:hover, .contact-item.active { background-color: #202c33; }
        .badge-tag { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .badge-admin { background-color: #f59e0b; color: #000; }
        .badge-bot { background-color: #10b981; color: #000; }

        .chat-main { flex: 1; display: flex; flex-direction: column; background-color: #0b141a; }
        .chat-header { padding: 15px; background-color: #202c33; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222d34; }
        .chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        
        .msg-bubble { max-width: 65%; padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; line-height: 1.4; word-wrap: break-word; }
        .msg-user { background-color: #202c33; align-self: flex-start; color: #e9edef; }
        .msg-bot { background-color: #005c4b; align-self: flex-end; color: #e9edef; }
        .msg-admin { background-color: #0284c7; align-self: flex-end; color: #fff; }

        .chat-footer { padding: 15px; background-color: #202c33; display: flex; gap: 10px; }
        .chat-footer input { flex: 1; background: #2a3942; border: none; color: #fff; padding: 12px; border-radius: 8px; outline: none; }
        .chat-footer button { background: #00a884; border: none; color: #111b21; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        /* BROADCAST STUDIO */
        .broadcast-container { max-width: 600px; margin: 30px auto; width: 100%; background: #111b21; padding: 25px; border-radius: 12px; border: 1px solid #222d34; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #8696a0; margin-bottom: 5px; font-weight: bold; }
        textarea, input { width: 100%; background: #202c33; border: 1px solid #2a3942; color: #fff; padding: 10px; border-radius: 6px; outline: none; }
        .btn-action { background: #00a884; border: none; color: #111b21; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('chat')">💬 Live Chat Panel</button>
        <button class="tab-btn" onclick="switchTab('broadcast')">🚀 Broadcast AI Studio</button>
    </div>

    <!-- TAB 1: LIVE CHAT PANEL -->
    <div id="tab-chat" class="tab-content active">
        <div class="chat-sidebar" id="contacts-list"></div>
        <div class="chat-main">
            <div class="chat-header" id="chat-header">
                <span id="active-contact-title">Pilih kontak untuk mulai percakapan</span>
                <div id="chat-actions"></div>
            </div>
            <div class="chat-body" id="chat-body"></div>
            <div class="chat-footer">
                <input type="text" id="manual-msg" placeholder="Ketik balasan sebagai Admin manusia...">
                <button onclick="sendManualReply()">Kirim</button>
            </div>
        </div>
    </div>

    <!-- TAB 2: BROADCAST STUDIO -->
    <div id="tab-broadcast" class="tab-content">
        <div class="broadcast-container">
            <h2 style="margin-bottom: 20px; color: #00a884;">Broadcast AI Studio</h2>
            <div class="form-group">
                <label>Draf Pesan Utama</label>
                <textarea id="draft" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Gaya Bahasa AI Prompt</label>
                <input type="text" id="prompt" placeholder="Contoh: Buat ramah dan santai">
            </div>
            <div class="form-group">
                <label>Nomor Tujuan (1 nomor/baris)</label>
                <textarea id="numbers" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>Jadwal Kirim (Opsional - Kosongkan jika ingin kirim sekarang)</label>
                <input type="datetime-local" id="schedule-time">
            </div>
            <button class="btn-action" onclick="sendBroadcast()">Kirim / Jadwalkan Broadcast</button>
            <p id="bc-status" style="margin-top: 10px; font-size: 0.85rem; color: #00a884;"></p>
        </div>
    </div>

    <script>
        const socket = io();
        let selectedJid = null;
        let contactsData = [];

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            if(tab === 'chat') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-chat').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-broadcast').classList.add('active');
            }
        }

        socket.on('connect', () => socket.emit('get_contacts'));

        socket.on('contacts_list', renderContacts);
        socket.on('contacts_updated', renderContacts);

        function renderContacts(contacts) {
            contactsData = contacts;
            const container = document.getElementById('contacts-list');
            container.innerHTML = '';
            contacts.forEach(c => {
                const div = document.createElement('div');
                div.className = `contact-item ${selectedJid === c.jid ? 'active' : ''}`;
                div.onclick = () => selectContact(c);
                div.innerHTML = `
                    <div>
                        <strong>${c.phone}</strong>
                        <div style="font-size:0.75rem; color:#8696a0;">${c.name}</div>
                    </div>
                    <span class="badge-tag ${c.is_handover ? 'badge-admin' : 'badge-bot'}">
                        ${c.is_handover ? 'ADMIN' : 'BOT'}
                    </span>
                `;
                container.appendChild(div);
            });
        }

        function selectContact(contact) {
            selectedJid = contact.jid;
            document.getElementById('active-contact-title').innerText = `Chatting dengan: ${contact.phone}`;
            
            const actions = document.getElementById('chat-actions');
            actions.innerHTML = `
                <button style="padding:6px 12px; background:${contact.is_handover ? '#10b981' : '#f59e0b'}; border:none; border-radius:4px; font-weight:bold; cursor:pointer;" onclick="toggleHandover('${contact.jid}', ${!contact.is_handover})">
                    ${contact.is_handover ? 'Kembalikan ke Bot' : 'Ambil Alih (Admin)'}
                </button>
            `;

            renderContacts(contactsData);
            socket.emit('get_messages', contact.jid);
        }

        socket.on('messages_list', ({ jid, messages }) => {
            if (selectedJid !== jid) return;
            const body = document.getElementById('chat-body');
            body.innerHTML = '';
            messages.forEach(m => {
                const msgDiv = document.createElement('div');
                let typeClass = 'msg-user';
                if(m.sender === 'Bot') typeClass = 'msg-bot';
                if(m.sender === 'Admin') typeClass = 'msg-admin';

                msgDiv.className = `msg-bubble ${typeClass}`;
                msgDiv.innerText = m.message;
                body.appendChild(msgDiv);
            });
            body.scrollTop = body.scrollHeight;
        });

        socket.on('new_message', ({ jid }) => {
            if (selectedJid === jid) socket.emit('get_messages', jid);
        });

        function sendManualReply() {
            const input = document.getElementById('manual-msg');
            if (!input.value || !selectedJid) return;
            socket.emit('send_manual_reply', { jid: selectedJid, message: input.value });
            input.value = '';
        }

        function toggleHandover(jid, status) {
            socket.emit('toggle_handover', { jid, status });
        }

        async function sendBroadcast() {
            const draft = document.getElementById('draft').value;
            const prompt = document.getElementById('prompt').value;
            const numbers = document.getElementById('numbers').value.split('\n').filter(n => n.trim());
            const scheduledTime = document.getElementById('schedule-time').value;

            const res = await fetch('/api/broadcast', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ draft, prompt, numbers, scheduledTime })
            });
            const data = await res.json();
            document.getElementById('bc-status').innerText = data.message;
        }
    </script>
</body>
</html>
